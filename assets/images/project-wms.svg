<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Warehouse Management System" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#140d2b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="660" fill="url(#bg)"/>
  <rect width="1200" height="660" fill="url(#grid)"/>
  <rect width="1200" height="660" fill="url(#glowA)"/>
  <rect width="1200" height="660" fill="url(#glowB)"/>

  <!-- Storage racks -->
  <g transform="translate(640 150)">
    <g stroke="#a5b4fc" stroke-opacity="0.55" stroke-width="4" fill="none">
      <path d="M0 0V340M200 0V340M220 0V340M420 0V340"/>
      <path d="M0 110H200M0 225H200M0 340H200M220 110H420M220 225H420M220 340H420"/>
    </g>
    <!-- boxes: row 1 -->
    <rect x="18" y="52" width="70" height="56" rx="4" fill="url(#box)"/>
    <rect x="98" y="68" width="84" height="40" rx="4" fill="url(#box2)"/>
    <rect x="238" y="46" width="60" height="62" rx="4" fill="url(#box2)"/>
    <rect x="308" y="60" width="94" height="48" rx="4" fill="url(#box)"/>
    <!-- row 2 -->
    <rect x="18" y="170" width="96" height="53" rx="4" fill="url(#box2)"/>
    <rect x="124" y="186" width="58" height="37" rx="4" fill="url(#box)"/>
    <rect x="238" y="176" width="74" height="47" rx="4" fill="url(#box)"/>
    <rect x="322" y="160" width="80" height="63" rx="4" fill="url(#box2)"/>
    <!-- row 3 -->
    <rect x="18" y="282" width="66" height="56" rx="4" fill="url(#box)"/>
    <rect x="94" y="296" width="88" height="42" rx="4" fill="url(#box)"/>
    <rect x="238" y="290" width="92" height="48" rx="4" fill="url(#box2)"/>
    <!-- barcode labels -->
    <g fill="#0b1022" fill-opacity="0.55">
      <rect x="38" y="72" width="30" height="4"/><rect x="258" y="66" width="22" height="4"/>
      <rect x="44" y="190" width="40" height="4"/><rect x="256" y="194" width="34" height="4"/>
      <rect x="36" y="302" width="30" height="4"/><rect x="262" y="310" width="40" height="4"/>
    </g>
    <!-- scan beam -->
    <path d="M330 290 L402 262" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
    <circle cx="402" cy="262" r="7" fill="#22d3ee"/>
  </g>

  <!-- Mini stock dashboard card -->
  <g transform="translate(578 462)">
    <rect width="190" height="120" rx="14" fill="#0f172a" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="18" y="18" width="70" height="8" rx="4" fill="#94a3b8" fill-opacity="0.6"/>
    <g fill="url(#accent)">
      <rect x="18" y="72" width="18" height="30" rx="3"/>
      <rect x="46" y="58" width="18" height="44" rx="3"/>
      <rect x="74" y="80" width="18" height="22" rx="3"/>
      <rect x="102" y="46" width="18" height="56" rx="3"/>
      <rect x="130" y="64" width="18" height="38" rx="3"/>
      <rect x="158" y="52" width="14" height="50" rx="3"/>
    </g>
  </g>

  <!-- Copy -->
  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
    <text x="72" y="262" font-size="58" font-weight="800" fill="#f8fafc">Warehouse</text>
    <text x="72" y="330" font-size="58" font-weight="800" fill="#f8fafc">Management</text>
    <text x="72" y="398" font-size="58" font-weight="800" fill="url(#accent)">System</text>
    <text x="74" y="452" font-size="22" font-weight="600" fill="#94a3b8">Built from scratch · Innovasiv Technologies</text>
  </g>
</svg>
