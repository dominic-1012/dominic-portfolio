<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Innovasiv Technologies company website" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070d"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <!-- Headline gradient taken from innovasivtech.com -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.4" stop-color="#ec4899"/>
      <stop offset="0.8" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- CTA gradient taken from innovasivtech.com -->
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" fill="url(#bg)"/>
  <rect width="1200" height="660" fill="url(#glow1)"/>
  <rect width="1200" height="660" fill="url(#glow2)"/>

  <!-- Faint code lines (the site's hero is a code editor photo) -->
  <g stroke-linecap="round" stroke-width="7" opacity="0.16">
    <path d="M760 150h120M900 150h60" stroke="#a78bfa"/>
    <path d="M790 180h180M990 180h40" stroke="#67e8f9"/>
    <path d="M790 210h90M900 210h150" stroke="#f9a8d4"/>
    <path d="M820 240h210" stroke="#a78bfa"/>
    <path d="M820 270h70M910 270h120" stroke="#67e8f9"/>
    <path d="M790 300h160" stroke="#f9a8d4"/>
    <path d="M760 330h80M860 330h170" stroke="#a78bfa"/>
    <path d="M790 360h130" stroke="#67e8f9"/>
    <path d="M790 390h60M870 390h160" stroke="#f9a8d4"/>
    <path d="M760 420h110" stroke="#a78bfa"/>
  </g>

  <!-- Nav bar -->
  <g font-family="Inter,'Segoe UI',Arial,sans-serif">
    <g font-size="15" font-weight="600" fill="#cbd5e1">
      <text x="520" y="82">About</text><text x="590" y="82">Apps</text><text x="652" y="82">Products</text>
      <text x="740" y="82">Services</text><text x="826" y="82">Contact</text>
    </g>
    <rect x="920" y="58" width="130" height="36" rx="18" fill="url(#cta)"/>
    <text x="985" y="82" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Let's Talk →</text>
    <path d="M72 116H1128" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>

  <text x="74" y="178" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#c4b5fd" letter-spacing="4">INNOVASIV TECHNOLOGIES</text>

  <!-- Headline -->
  <g font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-weight="800">
    <text x="72" y="268" font-size="88" fill="#f8fafc">Innovation</text>
    <text x="72" y="364" font-size="88" fill="url(#brand)">Inbuilt.</text>
  </g>
  <text x="74" y="416" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="500" fill="#94a3b8">ERP · Web &amp; Mobile · AI &amp; Cloud · Company Website</text>

  <!-- Stat chips (real values from the site) -->
  <g font-family="Inter,'Segoe UI',Arial,sans-serif">
    <g transform="translate(72 470)">
      <rect width="170" height="84" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="42" font-size="28" font-weight="800" fill="#f8fafc">2019</text>
      <text x="20" y="66" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">FOUNDED</text>
    </g>
    <g transform="translate(258 470)">
      <rect width="170" height="84" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="42" font-size="28" font-weight="800" fill="#f8fafc">9+</text>
      <text x="20" y="66" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">SERVICE AREAS</text>
    </g>
    <g transform="translate(444 470)">
      <rect width="170" height="84" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="42" font-size="28" font-weight="800" fill="#f8fafc">2</text>
      <text x="20" y="66" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">TAMIL NADU HUBS</text>
    </g>
